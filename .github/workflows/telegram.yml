name: Новости в Telegram
on:
  push:
    branches: [main]
    paths: ["news-*.html"]
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Отправить новые новости в канал
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/post_news.py
